<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Online - 专业教材搜索</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --secondary: #0ea5e9;
            --accent: #8b5cf6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #f0f9ff 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-top: 1rem;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            letter-spacing: -0.02em;
        }

        .logo {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.75rem;
            box-shadow: var(--shadow);
            -webkit-text-fill-color: white;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.15rem;
            font-weight: 400;
        }

        .search-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
            border: 1px solid rgba(226, 232, 240, 0.6);
        }

        .search-form {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 280px;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            outline: none;
            background: var(--bg);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: var(--card-bg);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow);
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
            filter: brightness(1.1);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .quick-searches {
            margin-bottom: 2.5rem;
        }

        .quick-searches h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .tag {
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tag:hover {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .results-section {
            display: none;
            margin-bottom: 2rem;
        }

        .results-section.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
        }

        .section-count {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }

        .card-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, var(--primary-light), #dbeafe);
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .card-link:hover {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            transform: translateX(2px);
        }

        .card-link svg {
            width: 16px;
            height: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .error-state {
            text-align: center;
            padding: 2.5rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-sm);
            color: #dc2626;
        }

        .error-state p {
            font-weight: 500;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                width: 44px;
                height: 44px;
                font-size: 1.5rem;
            }

            .search-box {
                padding: 1.5rem;
            }

            .search-input {
                min-width: 100%;
            }

            .search-btn {
                width: 100%;
                justify-content: center;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="logo">🎓</span>
                University Online
            </h1>
            <p class="subtitle">搜索专业教材，获取权威学习资源</p>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">⚠️ 需要使用Google访问，建议使用英文关键词搜索</p>
        </header>

        <main>
            <div class="search-box">
                <form class="search-form" id="searchForm">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="majorInput"
                        placeholder="请输入专业名称，例如：计算机科学、人工智能、经济学..." 
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="search-btn" id="searchBtn">
                        <span>🔍</span>
                        搜索教材
                    </button>
                </form>
            </div>

            <div class="quick-searches">
                <h3>热门搜索</h3>
                <div class="tags">
                    <span class="tag" data-major="计算机科学">计算机科学</span>
                    <span class="tag" data-major="人工智能">人工智能</span>
                    <span class="tag" data-major="数据科学">数据科学</span>
                    <span class="tag" data-major="机器学习">机器学习</span>
                    <span class="tag" data-major="心理学">心理学</span>
                    <span class="tag" data-major="经济学">经济学</span>
                    <span class="tag" data-major="法学">法学</span>
                    <span class="tag" data-major="医学">医学</span>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在搜索 "<span id="loadingKeyword"></span>" 的教材...</p>
            </div>

            <!-- 教材搜索结果 -->
            <div class="results-section" id="booksSection">
                <div class="section-header">
                    <h2 class="section-title">📚 推荐教材</h2>
                    <span class="section-count">共 <span id="booksCount">0</span> 本</span>
                </div>
                <div class="card-grid" id="booksGrid"></div>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>未找到相关教材，请尝试其他关键词</p>
            </div>

            <div class="error-state" id="errorState" style="display: none;">
                <p>⚠️ <span id="errorMessage">搜索出错，请稍后重试</span></p>
            </div>
        </main>
        
        <footer style="text-align: center; padding: 2rem; margin-top: 3rem; border-top: 1px solid var(--border);">
            <a href="https://github.com/vvlife/UniversityOnline.Skill" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem;">
                🔗 查看 University Online Skill
            </a>
        </footer>
    </div>

    <script>
        const MAX_ITEMS = 12;
        
        // CORS proxies
        const CORS_PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://api.codetabs.com/v1/proxy?quest='
        ];

        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const majorInput = document.getElementById('majorInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const loadingKeyword = document.getElementById('loadingKeyword');
        const booksSection = document.getElementById('booksSection');
        const booksCount = document.getElementById('booksCount');
        const booksGrid = document.getElementById('booksGrid');
        const emptyState = document.getElementById('emptyState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');

        // Quick search tags
        document.querySelectorAll('.tag').forEach(tag => {
            tag.addEventListener('click', () => {
                const major = tag.dataset.major;
                majorInput.value = major;
                searchForm.dispatchEvent(new Event('submit'));
            });
        });

        // Search handler
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const keyword = majorInput.value.trim();
            if (!keyword) return;

            // UI states
            searchBtn.disabled = true;
            loading.classList.add('active');
            loadingKeyword.textContent = keyword;
            
            // Reset results
            booksSection.classList.remove('active');
            emptyState.style.display = 'none';
            errorState.style.display = 'none';

            try {
                const books = await searchBooks(keyword);
                
                loading.classList.remove('active');
                
                if (books.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    booksCount.textContent = books.length;
                    renderBooks(books);
                    booksSection.classList.add('active');
                }
                
            } catch (error) {
                loading.classList.remove('active');
                errorMessage.textContent = error.message || '搜索出错，请稍后重试';
                errorState.style.display = 'block';
            } finally {
                searchBtn.disabled = false;
            }
        });

        // Try fetching with multiple CORS proxies
        async function fetchWithProxy(url, options = {}) {
            let lastError;
            
            for (const proxy of CORS_PROXIES) {
                try {
                    const proxyUrl = proxy + encodeURIComponent(url);
                    const response = await fetch(proxyUrl, options);
                    
                    if (response.ok) {
                        return response;
                    }
                } catch (error) {
                    lastError = error;
                    continue;
                }
            }
            
            throw lastError || new Error('所有代理都失败了');
        }

        // Search books from Open Library + Google Books
        async function searchBooks(keyword) {
            let books = [];
            
            // Search Open Library
            try {
                const openLibUrl = `https://openlibrary.org/search.json?q=${encodeURIComponent(keyword)}&limit=15`;
                const response = await fetch(openLibUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    
                    for (const doc of data.docs || []) {
                        if (books.length >= MAX_ITEMS) break;
                        
                        if (doc.title && doc.author_name?.length > 0) {
                            books.push({
                                title: doc.title.substring(0, 100),
                                authors: doc.author_name.slice(0, 2).join(', '),
                                publisher: (doc.publisher || [])[0]?.substring(0, 50) || '未知出版社',
                                openLibraryKey: doc.key,
                                isbn: (doc.isbn || [])[0]
                            });
                        }
                    }
                }
            } catch (error) {
                console.warn('Open Library 直接请求失败:', error);
                
                // Try via proxy
                try {
                    const openLibUrl = `https://openlibrary.org/search.json?q=${encodeURIComponent(keyword)}&limit=15`;
                    const proxyResponse = await fetchWithProxy(openLibUrl);
                    const data = await proxyResponse.json();
                    
                    for (const doc of data.docs || []) {
                        if (books.length >= MAX_ITEMS) break;
                        
                        if (doc.title && doc.author_name?.length > 0) {
                            books.push({
                                title: doc.title.substring(0, 100),
                                authors: doc.author_name.slice(0, 2).join(', '),
                                publisher: (doc.publisher || [])[0]?.substring(0, 50) || '未知出版社',
                                openLibraryKey: doc.key,
                                isbn: (doc.isbn || [])[0]
                            });
                        }
                    }
                } catch (proxyError) {
                    console.warn('Open Library 代理请求也失败:', proxyError);
                }
            }

            // If not enough results, try Google Books
            if (books.length < MAX_ITEMS) {
                try {
                    const googleUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(keyword)}&maxResults=${MAX_ITEMS - books.length}&printType=books`;
                    const response = await fetch(googleUrl);
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        for (const item of data.items || []) {
                            if (books.length >= MAX_ITEMS) break;
                            
                            const volInfo = item.volumeInfo || {};
                            if (volInfo.title && volInfo.authors?.length > 0) {
                                const exists = books.some(b => 
                                    b.title.toLowerCase() === volInfo.title.toLowerCase()
                                );
                                if (!exists) {
                                    books.push({
                                        title: volInfo.title.substring(0, 100),
                                        authors: volInfo.authors.slice(0, 2).join(', '),
                                        publisher: (volInfo.publisher || '未知出版社').substring(0, 50),
                                        googleBooksId: item.id,
                                        isbn: (volInfo.industryIdentifiers || []).find(i => i.type === 'ISBN_13')?.identifier
                                    });
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.warn('Google Books 失败:', error);
                }
            }

            return books;
        }

        // Render book cards with links
        function renderBooks(books) {
            booksGrid.innerHTML = books.map(book => {
                let linkUrl = '#';
                let linkText = '查看详情';
                
                if (book.openLibraryKey) {
                    linkUrl = `https://openlibrary.org${book.openLibraryKey}`;
                    linkText = 'Open Library';
                } else if (book.googleBooksId) {
                    linkUrl = `https://books.google.com/books?id=${book.googleBooksId}`;
                    linkText = 'Google Books';
                } else if (book.isbn) {
                    linkUrl = `https://openlibrary.org/isbn/${book.isbn}`;
                    linkText = '查看详情';
                }
                
                return `
                    <article class="card" tabindex="0">
                        <h3 class="card-title">${escapeHtml(book.title)}</h3>
                        <p class="card-meta">
                            <span>👤</span>
                            ${escapeHtml(book.authors)}
                        </p>
                        <p class="card-meta">
                            <span>🏢</span>
                            ${escapeHtml(book.publisher)}
                        </p>
                        <a href="${escapeHtml(linkUrl)}" target="_blank" rel="noopener" class="card-link">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                            ${escapeHtml(linkText)}
                        </a>
                    </article>
                `;
            }).join('');
        }

        // XSS prevention
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Focus input on load
        majorInput.focus();
    </script>
</body>
</html>
